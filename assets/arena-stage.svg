<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- «Сцена турніру»: прожектори, глядачі-силуети, неоновий подіум -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="0.6" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>

    <!-- Конуси прожекторів -->
    <linearGradient id="beam-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="stage-glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="900" height="500" fill="url(#bg)"></rect>

  <!-- Прожекторні конуси -->
  <path d="M180 0 L60 240 L300 240 Z" fill="url(#beam-violet)"></path>
  <path d="M720 0 L600 240 L840 240 Z" fill="url(#beam-teal)"></path>
  <path d="M450 -30 L250 230 L650 230 Z" fill="url(#beam-violet)" opacity="0.5"></path>

  <!-- Культи сцени -->
  <g stroke="rgba(148,163,196,0.22)" stroke-width="2" fill="none">
    <line x1="0" y1="60" x2="900" y2="60"></line>
  </g>
  <rect x="0" y="58" width="900" height="4" fill="#8b5cf6" opacity="0.35"></rect>

  <!-- Головний екран сцени -->
  <rect x="270" y="90" width="360" height="150" rx="14" fill="#101a33" stroke="rgba(139,92,246,0.6)" stroke-width="2"></rect>
  <rect x="290" y="110" width="320" height="90" rx="8" fill="url(#stage-glow)"></rect>

  <!-- Смуги supported resolutions -->
  <rect x="290" y="214" width="52" height="10" rx="5" fill="#2dd4a7" opacity="0.7"></rect>
  <rect x="354" y="214" width="52" height="10" rx="5" fill="#8b5cf6" opacity="0.7"></rect>

  <!-- Сцена-подіум -->
  <ellipse cx="450" cy="330" rx="290" ry="60" fill="#0e1730"></ellipse>
  <ellipse cx="450" cy="326" rx="290" ry="56" fill="url(#stage-glow)" opacity="0.8"></ellipse>

  <!-- Глядачі: силуети голів -->
  <g fill="#05070f">
    <circle cx="80"  cy="470" r="26"></circle>
    <circle cx="150" cy="486" r="30"></circle>
    <circle cx="230" cy="472" r="28"></circle>
    <circle cx="310" cy="492" r="32"></circle>
    <circle cx="400" cy="478" r="30"></circle>
    <circle cx="500" cy="490" r="32"></circle>
    <circle cx="590" cy="474" r="28"></circle>
    <circle cx="670" cy="492" r="30"></circle>
    <circle cx="760" cy="478" r="28"></circle>
    <circle cx="850" cy="494" r="30"></circle>
  </g>

  <!-- Вогники телефонів у натовпі -->
  <g fill="#e9d5ff" opacity="0.8">
    <circle cx="150" cy="462" r="3"></circle>
    <circle cx="310" cy="468" r="3"></circle>
    <circle cx="500" cy="466" r="3"></circle>
    <circle cx="670" cy="470" r="3"></circle>
  </g>
  <g fill="#9beee0" opacity="0.7">
    <circle cx="230" cy="450" r="3"></circle>
    <circle cx="400" cy="456" r="3"></circle>
    <circle cx="590" cy="452" r="3"></circle>
    <circle cx="760" cy="456" r="3"></circle>
  </g>

  <!-- Зіркове пиловидне світло -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="120" r="1.6"></circle>
    <circle cx="540" cy="60" r="1.4"></circle>
    <circle cx="330" cy="40" r="1.2"></circle>
    <circle cx="640" cy="30" r="1.5"></circle>
  </g>

  <!-- Легкий він'єтинг по краях -->
  <rect width="900" height="500" fill="url(#beam-violet)" opacity="0.06"></rect>
</svg>
